<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — LUMI INTERNATIONAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="form-card">
      <h2>LOGIN</h2>
      <p class="subtitle">LUMI 회원으로 로그인하세요</p>
      <div class="form-error" id="err"></div>
      <form id="loginForm">
        <div class="form-row">
          <label>이메일</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-row">
          <label>비밀번호</label>
          <input type="password" name="password" required>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </div>
        <p class="alt">
          아직 회원이 아니신가요? <a href="/pages/signup.html">회원가입 →</a>
        </p>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        LumiAuth.login(fd.get('email'), fd.get('password'));
        const next = new URLSearchParams(location.search).get('next') || '/pages/mypage.html';
        location.href = next;
      } catch (err) {
        const el = document.getElementById('err');
        el.textContent = err.message;
        el.classList.add('show');
      }
    });
  </script>
</body>
</html>
