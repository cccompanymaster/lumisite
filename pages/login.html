<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf7f2">
  <title>로그인 — ORAVIN</title>
  <meta property="og:title" content="로그인 — ORAVIN">
  <meta property="og:description" content="ORAVIN — 프리미엄 스킨부스터 인스파이어드 스킨케어">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cccompanymaster.github.io/lumisite/pages/login.html">
  <meta property="og:image" content="https://cccompanymaster.github.io/lumisite/assets/images/og/og-image.png?v=2">
  <meta property="og:image:secure_url" content="https://cccompanymaster.github.io/lumisite/assets/images/og/og-image.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ORAVIN — Premium Skin Booster Inspired Skincare">
  <meta property="og:site_name" content="ORAVIN">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="로그인 — ORAVIN">
  <meta name="twitter:description" content="ORAVIN — 프리미엄 스킨부스터 인스파이어드 스킨케어">
  <meta name="twitter:image" content="https://cccompanymaster.github.io/lumisite/assets/images/og/og-image.png?v=2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c130f'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Georgia' font-style='italic' font-size='52' fill='%238b3a3a'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="preloader">
    <div class="logo-mark">O R A V I N</div>
    <div class="small">프리미엄 스킨케어</div>
    <div class="bar"></div>
  </div>

  <div id="site-header"></div>

  <main>
    <div class="form-card">
      <h2>로그인</h2>
      <p class="subtitle">ORAVIN 멤버로 로그인하세요</p>
      <div class="form-error" id="err"></div>
      <form id="loginForm">
        <div class="form-row">
          <label>이메일</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-row">
          <label>비밀번호</label>
          <input type="password" name="password" required>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </div>
        <p class="alt">
          아직 회원이 아니신가요? <a href="signup.html">회원가입 →</a>
        </p>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        LumiAuth.login(fd.get('email'), fd.get('password'));
        const next = new URLSearchParams(location.search).get('next') || 'mypage.html';
        location.href = next;
      } catch (err) {
        const el = document.getElementById('err');
        el.textContent = err.message;
        el.classList.add('show');
      }
    });
  </script>
</body>
</html>
