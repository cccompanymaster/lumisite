<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf7f2">
  <title>PRODUCT — ORAVIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c130f'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Georgia' font-style='italic' font-size='52' fill='%238b3a3a'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="preloader">
    <div class="logo-mark">O R A V I N</div>
    <div class="small">프리미엄 스킨케어</div>
    <div class="bar"></div>
  </div>

  <div id="site-header"></div>
  <main class="container" id="productView"></main>

  <section class="section" style="background:var(--c-bg-alt);">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">함께 보면 좋은</span>
        <h2>다른 <em>제품</em></h2>
      </div>
      <div class="product-grid reveal-stagger" data-product-grid data-filter="best"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <div class="modal-back" id="addedModal">
    <div class="modal">
      <h3>장바구니에 담았습니다</h3>
      <p>지금 결제하시거나 계속 쇼핑하실 수 있습니다.</p>
      <div class="actions">
        <a class="btn btn-outline" href="#" id="modalContinue">계속 쇼핑</a>
        <a class="btn btn-primary" href="cart.html">장바구니 보기</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const id = parseInt(params.get('id'));
      const p = LUMI_PRODUCTS.find(x => x.id === id);
      const view = document.getElementById('productView');
      if (!p) {
        view.innerHTML = `<div class="empty"><h3>상품을 찾을 수 없습니다.</h3><a class="btn btn-primary" href="shop.html">SHOP으로 돌아가기</a></div>`;
        return;
      }
      const off = Math.round((1 - p.salePrice / p.price) * 100);
      const tagHTML = p.tags.map(t => {
        const cls = t === 'NEW' ? 'new' : (t === 'SET' ? 'set' : '');
        return `<span class="tag ${cls}">${t}</span>`;
      }).join('');

      view.innerHTML = `
        <p class="breadcrumb" style="padding:24px 0 0;"><a href="../index.html">홈</a> · <a href="shop.html">쇼핑</a> · ${p.nameKo || p.name}</p>
        <div class="product-detail">
          <div class="main-img"><img src="${(window.LUMI_PREFIX||'../')+p.image}" alt="${p.name}"></div>
          <div class="info-side">
            <div class="cat-label">${p.cat_label || ''}</div>
            <div class="tags">${tagHTML}</div>
            <h1>${p.name}<span class="sub">${p.nameKo || ''}${p.size ? ' · ' + p.size : ''}</span></h1>
            <p class="desc">${p.desc}</p>
            <div class="price-block">
              <span class="original">${formatPrice(p.price)}</span>
              <div class="current">${off > 0 ? `<span class="discount">${off}%</span>` : ''}${formatPrice(p.salePrice)}</div>
            </div>
            <div class="opt-row">
              <label>옵션 선택</label>
              <select id="optSelect">
                ${p.options.map((o, i) => `<option value="${i}">${o.name} ${o.addPrice ? `(+${formatPrice(o.addPrice)})` : ''}</option>`).join('')}
              </select>
            </div>
            <div class="qty-row">
              <label>수량</label>
              <button id="qtyMinus">−</button>
              <input type="number" id="qty" value="1" min="1">
              <button id="qtyPlus">+</button>
            </div>
            <div class="actions">
              <button class="btn btn-outline" id="addToCart">장바구니</button>
              <button class="btn btn-primary" id="buyNow">바로구매</button>
            </div>
          </div>
        </div>
        <div class="detail-fallback" id="detailFallback">
          <div class="detail-body">
            <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:4px; color:var(--c-gold); text-transform:uppercase; display:block; text-align:center; margin-bottom:14px;">제품 상세</span>
            <h3>${p.name}</h3>
            <p>${p.detail}</p>
          </div>
          ${renderDetailContent(p)}
        </div>
        <div class="detail-images" id="detailImages"></div>
      `;

      const qty = document.getElementById('qty');
      document.getElementById('qtyMinus').onclick = () => { qty.value = Math.max(1, +qty.value - 1); };
      document.getElementById('qtyPlus').onclick = () => { qty.value = +qty.value + 1; };

      function addItem() { LumiCart.add(p.id, +document.getElementById('optSelect').value, +qty.value); }
      document.getElementById('addToCart').onclick = () => { addItem(); document.getElementById('addedModal').classList.add('show'); };
      document.getElementById('buyNow').onclick = () => { addItem(); location.href = 'checkout.html'; };
      document.getElementById('modalContinue').onclick = (e) => { e.preventDefault(); document.getElementById('addedModal').classList.remove('show'); };

      // 상세페이지 이미지 자동 로딩 (detailSlug-01, -02 ... 순차 / jpg→png→webp 탐색)
      loadDetailImages(p.detailSlug || p.slug || p.id);
    });

    // detailContent 데이터 → 상세페이지 섹션 렌더링
    function renderDetailContent(p) {
      const d = p.detailContent;
      if (!d) return '';
      let html = '';

      // 키비주얼 (다크)
      html += `
        <section class="pd-hero">
          <div class="pd-wrap">
            <p class="pd-en">${d.heroEn || ''}</p>
            <h2 class="pd-hero-title">${d.heroTitle || ''}</h2>
            <p class="pd-hero-sub">${d.heroSub || ''}</p>
          </div>
        </section>`;

      // 스포트라이트 (성분/시스템 설명 + 포인트)
      if (d.spotlight) {
        const s = d.spotlight;
        html += `
          <section class="pd-spotlight">
            <div class="pd-wrap">
              <span class="pd-eyebrow">${s.eyebrow || ''}</span>
              <h3 class="pd-h">${s.title || ''}</h3>
              ${s.body ? `<p class="pd-lead">${s.body}</p>` : ''}
              <div class="pd-points">
                ${(s.points || []).map(pt => `
                  <div class="pd-point"><div class="pd-point-k">${pt.k}</div><div class="pd-point-v">${pt.v}</div></div>
                `).join('')}
              </div>
              ${s.quote ? `<blockquote class="pd-quote">"${s.quote}"</blockquote>` : ''}
            </div>
          </section>`;
      }

      // 핵심 베네핏 (광채/탄력/보습)
      if (d.benefits) {
        html += `
          <section class="pd-benefits">
            <div class="pd-wrap">
              <div class="pd-benefit-grid">
                ${d.benefits.map(b => `
                  <div class="pd-benefit"><div class="pd-benefit-k">${b.k}</div><div class="pd-benefit-v">${b.v}</div></div>
                `).join('')}
              </div>
            </div>
          </section>`;
      }

      // 임상 결과
      if (d.clinical) {
        const c = d.clinical;
        html += `
          <section class="pd-clinical">
            <div class="pd-wrap">
              <h3 class="pd-h center">${c.title}</h3>
              <div class="pd-bars">
                ${c.items.map(it => `
                  <div class="pd-bar-row">
                    <span class="pd-bar-label">${it.k}</span>
                    <span class="pd-bar-track"><span class="pd-bar-fill" style="width:${it.v}%"></span></span>
                    <span class="pd-bar-val">${it.v}%</span>
                  </div>
                `).join('')}
              </div>
              ${c.note ? `<p class="pd-note">* ${c.note}</p>` : ''}
            </div>
          </section>`;
      }

      // 특징
      if (d.features) {
        html += `
          <section class="pd-features">
            <div class="pd-wrap">
              <div class="pd-feature-grid">
                ${d.features.map((f, i) => `
                  <div class="pd-feature">
                    <div class="pd-feature-no">0${i + 1}</div>
                    <div class="pd-feature-k">${f.k}</div>
                    <div class="pd-feature-v">${f.v}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>`;
      }

      // 부위별 케어 (밤)
      if (d.areas) {
        html += `
          <section class="pd-areas">
            <div class="pd-wrap">
              <h3 class="pd-h center">집중 케어가 필요한 부위에</h3>
              <div class="pd-area-list">
                ${d.areas.map(a => `
                  <div class="pd-area"><div class="pd-area-k">${a.k}</div><div class="pd-area-v">${a.v}</div></div>
                `).join('')}
              </div>
            </div>
          </section>`;
      }

      // 성분
      if (d.ingredients) {
        html += `
          <section class="pd-ingredients">
            <div class="pd-wrap">
              <span class="pd-eyebrow center">PREMIUM INGREDIENTS</span>
              <h3 class="pd-h center">${d.ingredients.length}가지 핵심 성분</h3>
              <div class="pd-ing-grid">
                ${d.ingredients.map(ig => `
                  <div class="pd-ing"><div class="pd-ing-k">${ig.k}</div><div class="pd-ing-v">${ig.v}</div></div>
                `).join('')}
              </div>
            </div>
          </section>`;
      }

      // 사용법
      if (d.howto) {
        html += `
          <section class="pd-howto">
            <div class="pd-wrap">
              <h3 class="pd-h center">HOW TO USE</h3>
              <div class="pd-howto-list">
                ${d.howto.map(h => `
                  <div class="pd-howto-item"><div class="pd-howto-step">${h.step}</div><div class="pd-howto-v">${h.v}</div></div>
                `).join('')}
              </div>
            </div>
          </section>`;
      }

      return html;
    }

    // assets/images/details/{slug}-NN.{ext} 를 01부터 순차 로드, 첫 실패 시 중단
    function loadDetailImages(slug) {
      const container = document.getElementById('detailImages');
      if (!container) return;
      const exts = ['jpg', 'png', 'webp'];
      let idx = 1;
      function tryLoad(n) {
        const num = String(n).padStart(2, '0');
        let extPos = 0;
        const img = new Image();
        const attempt = () => {
          img.src = `../assets/images/details/${slug}-${num}.${exts[extPos]}`;
        };
        img.onload = () => {
          // 스토어 상세 이미지가 있으면 HTML 상세(텍스트·섹션)는 숨김
          if (n === 1) {
            const fb = document.getElementById('detailFallback');
            if (fb) fb.style.display = 'none';
          }
          const el = document.createElement('img');
          el.src = img.src;
          el.alt = `상세 이미지 ${num}`;
          el.loading = 'lazy';
          container.appendChild(el);
          tryLoad(n + 1);          // 다음 번호 시도
        };
        img.onerror = () => {
          extPos++;
          if (extPos < exts.length) attempt();   // 다른 확장자 시도
          // 모든 확장자 실패 → 해당 번호 없음 → 중단 (단 01이 없으면 그냥 텍스트 상세만 표시)
        };
        attempt();
      }
      tryLoad(idx);
    }
  </script>
</body>
</html>
