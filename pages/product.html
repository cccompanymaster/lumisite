<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODUCT — LUMI INTERNATIONAL</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container" id="productView"></main>
  <div id="site-footer"></div>

  <div class="modal-back" id="addedModal">
    <div class="modal">
      <h3>장바구니에 담겼습니다</h3>
      <p>지금 결제하시거나 계속 쇼핑할 수 있습니다.</p>
      <div class="actions">
        <a class="btn btn-outline" href="#" id="modalContinue">계속 쇼핑</a>
        <a class="btn btn-primary" href="/pages/cart.html">장바구니 보기</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const id = parseInt(params.get('id'));
      const p = LUMI_PRODUCTS.find(x => x.id === id);
      const view = document.getElementById('productView');
      if (!p) {
        view.innerHTML = `<div class="empty"><h3>상품을 찾을 수 없습니다.</h3><a class="btn btn-primary" href="/pages/shop.html">SHOP으로 돌아가기</a></div>`;
        return;
      }
      const off = Math.round((1 - p.salePrice / p.price) * 100);
      const tagHTML = p.tags.map(t => {
        const cls = t === 'NEW' ? 'new' : (t === 'SET' ? 'set' : '');
        return `<span class="tag ${cls}">${t}</span>`;
      }).join('');

      view.innerHTML = `
        <p class="breadcrumb" style="padding:20px 0 0;"><a href="/">HOME</a> &gt; <a href="/pages/shop.html">SHOP</a> &gt; ${p.name}</p>
        <div class="product-detail">
          <div class="main-img"><img src="${p.image}" alt="${p.name}"></div>
          <div class="info-side">
            <div class="tags">${tagHTML}</div>
            <h1>${p.name}</h1>
            <p class="desc">${p.desc}</p>
            <div class="price-block">
              <span class="original">${formatPrice(p.price)}</span>
              <div class="current">${off > 0 ? `<span class="discount">${off}%</span>` : ''}${formatPrice(p.salePrice)}</div>
            </div>
            <div class="opt-row">
              <label>옵션 선택</label>
              <select id="optSelect">
                ${p.options.map((o, i) => `<option value="${i}">${o.name} ${o.addPrice ? `(+${formatPrice(o.addPrice)})` : ''}</option>`).join('')}
              </select>
            </div>
            <div class="qty-row">
              <label style="font-size:12px; font-weight:600;">수량</label>
              <button id="qtyMinus">−</button>
              <input type="number" id="qty" value="1" min="1">
              <button id="qtyPlus">+</button>
            </div>
            <div class="actions">
              <button class="btn btn-outline" id="addToCart">장바구니</button>
              <button class="btn btn-primary" id="buyNow">바로구매</button>
            </div>
          </div>
        </div>
        <div class="detail-body">
          <h3>PRODUCT DETAIL</h3>
          <p>${p.detail}</p>
        </div>
      `;

      const qty = document.getElementById('qty');
      document.getElementById('qtyMinus').onclick = () => { qty.value = Math.max(1, +qty.value - 1); };
      document.getElementById('qtyPlus').onclick = () => { qty.value = +qty.value + 1; };

      function addItem() {
        LumiCart.add(p.id, +document.getElementById('optSelect').value, +qty.value);
      }
      document.getElementById('addToCart').onclick = () => {
        addItem();
        document.getElementById('addedModal').classList.add('show');
      };
      document.getElementById('buyNow').onclick = () => {
        addItem();
        location.href = '/pages/checkout.html';
      };
      document.getElementById('modalContinue').onclick = (e) => {
        e.preventDefault();
        document.getElementById('addedModal').classList.remove('show');
      };
    });
  </script>
</body>
</html>
