<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf7f2">
  <title>주문 완료 — ORAVIN</title>
  <meta property="og:title" content="주문 완료 — ORAVIN">
  <meta property="og:description" content="ORAVIN — 프리미엄 스킨부스터 인스파이어드 스킨케어">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cccompanymaster.github.io/lumisite/pages/order-complete.html">
  <meta property="og:image" content="https://cccompanymaster.github.io/lumisite/assets/images/og/og-image.png?v=4">
  <meta property="og:image:secure_url" content="https://cccompanymaster.github.io/lumisite/assets/images/og/og-image.png?v=4">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ORAVIN — Premium Skin Booster Inspired Skincare">
  <meta property="og:site_name" content="ORAVIN">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="주문 완료 — ORAVIN">
  <meta name="twitter:description" content="ORAVIN — 프리미엄 스킨부스터 인스파이어드 스킨케어">
  <meta name="twitter:image" content="https://cccompanymaster.github.io/lumisite/assets/images/og/og-image.png?v=4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c130f'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Georgia' font-style='italic' font-size='52' fill='%238b3a3a'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="preloader">
    <div class="logo-mark">O R A V I N</div>
    <div class="small">프리미엄 스킨케어</div>
    <div class="bar"></div>
  </div>

  <div id="site-header"></div>

  <main class="container" style="padding: 60px 20px 80px;">
    <div id="orderView" style="max-width: 640px; margin: 0 auto; text-align:center;"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/payment-config.js"></script>
  <script src="../assets/js/payment.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const view = document.getElementById('orderView');
      const params = new URLSearchParams(location.search);
      const paymentKey = params.get('paymentKey');
      const orderId = params.get('orderId');
      const amount = params.get('amount');

      // 토스페이먼츠 success 리다이렉트로 진입한 경우 — pendingOrder를 lastOrder로 승격 + 검증
      if (paymentKey && orderId && amount) {
        const pending = JSON.parse(sessionStorage.getItem('lumi.pendingOrder') || 'null');
        if (pending && pending.id === orderId) {
          pending.status = 'paid';
          pending.payment = { paymentKey, orderId, amount: Number(amount) };
          // 서버 검증 (구성되어 있으면)
          try { await window.LumiPayment.confirmPayment({ paymentKey, orderId, amount }); } catch (e) {}
          if (window.LumiAuth && window.LumiAuth.current()) window.LumiAuth.addOrder(pending);
          if (window.LumiCart) window.LumiCart.clear();
          sessionStorage.setItem('lumi.lastOrder', JSON.stringify(pending));
          sessionStorage.removeItem('lumi.pendingOrder');
        }
      }

      const order = JSON.parse(sessionStorage.getItem('lumi.lastOrder') || 'null');
      if (!order) {
        view.innerHTML = `<div class="empty"><h3>주문 정보가 없습니다.</h3><a class="btn btn-primary" href="shop.html">SHOP으로 이동</a></div>`;
        return;
      }
      view.innerHTML = `
        <div style="width:64px; height:64px; border:1px solid var(--c-gold); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:32px; color:var(--c-gold); font-style:italic; margin-bottom:24px;">✓</div>
        <span class="eyebrow" style="font-family:var(--font-mono); font-size:10px; letter-spacing:5px; color:var(--c-gold); text-transform:uppercase; display:block; margin-bottom:10px;">주문 완료</span>
        <h1 style="font-family:var(--font-display); font-size:36px; margin:0 0 12px; font-weight:400; letter-spacing:-0.5px;">감사합니다</h1>
        <p style="color:var(--c-ink-soft); margin-bottom:30px; font-size:13px;">주문이 정상적으로 완료되었습니다.<br>입력하신 이메일로 주문 내역을 발송해드릴 예정입니다.</p>
        <div style="background:var(--c-bg-alt); padding:24px; text-align:left; margin-bottom:24px;">
          <div style="display:flex; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--c-line); margin-bottom:14px; font-size:13px;">
            <span style="color:var(--c-muted);">주문 번호</span>
            <strong>${order.id}</strong>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
            <span style="color:var(--c-muted);">결제 수단</span>
            <span>${({card:'신용/체크카드',trans:'계좌이체',vbank:'무통장 입금',kakaopay:'카카오페이',naverpay:'네이버페이',toss:'토스페이'})[order.payMethod] || order.payMethod}</span>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
            <span style="color:var(--c-muted);">결제 금액</span>
            <strong style="color:var(--c-gold); font-family:var(--font-display); font-size:18px; font-style:italic;">${formatPrice(order.totalPaid)}</strong>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
            <span style="color:var(--c-muted);">받는 분</span>
            <span>${order.shipTo.name}</span>
          </div>
          <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
            <span style="color:var(--c-muted);">배송지</span>
            <span style="text-align:right;">[${order.shipTo.zip}] ${order.shipTo.addr1} ${order.shipTo.addr2}</span>
          </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          <a class="btn btn-outline" href="shop.html">계속 쇼핑</a>
          <a class="btn btn-primary" href="mypage.html">주문 내역 보기</a>
        </div>
      `;
    });
  </script>
</body>
</html>
