<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf7f2">
  <title>회원가입 — ORAVIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c130f'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Georgia' font-style='italic' font-size='52' fill='%238b3a3a'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="preloader">
    <div class="logo-mark">O R A V I N</div>
    <div class="small">프리미엄 스킨케어</div>
    <div class="bar"></div>
  </div>

  <div id="site-header"></div>

  <main>
    <div class="form-card">
      <h2>회원가입</h2>
      <p class="subtitle">신규 가입 시 15,000원 적립금 즉시 지급</p>
      <div class="form-error" id="err"></div>
      <form id="signupForm">
        <div class="form-row">
          <label>이메일 *</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-row">
          <label>비밀번호 * <span class="help" style="display:inline-block;">6자 이상</span></label>
          <input type="password" name="password" minlength="6" required>
        </div>
        <div class="form-row">
          <label>이름 *</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-row">
          <label>휴대전화 *</label>
          <input type="tel" name="phone" placeholder="010-0000-0000" required>
        </div>

        <div class="form-row check">
          <input type="checkbox" name="agreeTerms" id="agreeTerms" required>
          <label for="agreeTerms">[필수] 이용약관에 동의합니다.</label>
        </div>
        <div class="form-row check">
          <input type="checkbox" name="agreePrivacy" id="agreePrivacy" required>
          <label for="agreePrivacy">[필수] 개인정보 수집·이용에 동의합니다.</label>
        </div>
        <div class="form-row check">
          <input type="checkbox" name="marketing" id="marketing">
          <label for="marketing">[선택] 마케팅 정보 수신에 동의합니다.</label>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary btn-block">가입하기</button>
        </div>
        <p class="alt">
          이미 회원이신가요? <a href="login.html">로그인 →</a>
        </p>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        LumiAuth.signup({
          email: fd.get('email'),
          password: fd.get('password'),
          name: fd.get('name'),
          phone: fd.get('phone'),
          marketing: fd.get('marketing') === 'on'
        });
        location.href = 'mypage.html';
      } catch (err) {
        const el = document.getElementById('err');
        el.textContent = err.message;
        el.classList.add('show');
      }
    });
  </script>
</body>
</html>
