<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP — LUMI INTERNATIONAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-head">
    <span class="eyebrow">COLLECTION</span>
    <h1>Shop</h1>
    <p>LUMI 시그니처 컬렉션을 만나보세요</p>
  </div>

  <main>
    <nav class="category-tabs" id="categoryTabs"></nav>
    <div class="container" style="padding-bottom: 100px;">
      <div class="product-grid" data-product-grid data-filter="all" id="shopGrid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const current = params.get('cat') || 'all';
      const tabs = document.getElementById('categoryTabs');
      const grid = document.getElementById('shopGrid');

      tabs.innerHTML = LUMI_CATEGORIES.map(c =>
        `<a href="?cat=${c.id}" class="${c.id === current ? 'active' : ''}">${c.name}</a>`
      ).join('');

      grid.dataset.filter = current;
      let items = LUMI_PRODUCTS.slice();
      if (current === 'best') items = items.filter(p => p.tags.includes('BEST'));
      else if (current === 'new') items = items.filter(p => p.tags.includes('NEW'));
      else if (current === 'set') items = items.filter(p => p.tags.includes('SET'));
      else if (current !== 'all') items = items.filter(p => p.category === current);
      grid.innerHTML = items.map(productCardHTML).join('');
    });
  </script>
</body>
</html>
